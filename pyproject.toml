[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-factory"
version = "0.1.0"
description = "媒体内容自动生产与发布"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.2",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.1",
    "google-auth-httplib2>=0.2.0",
    "PySocks>=1.7.1",
    "boto3>=1.34",
    "Pillow>=10.0",
    "mcp>=1.26,<2",
    "msgpack>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "yt-dlp>=2024.0.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "py-mini-racer>=0.6.0",
    "fonttools>=4.53",
    # 系统依赖（非 pip 包）：ffmpeg 需自行安装并加入 PATH（如 winget install Gyan.FFmpeg）
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
agent = [
    "deepagents>=0.7.32,<0.8",
    "langchain-openai>=1.7.3,<2",
    "langsmith>=0.14.16,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "httpx>=0.28,<1",
    "filelock>=3.16,<5",
    "jsonschema>=4.23,<5",
]
desktop = [
    "open-webui==0.12.3",
    "tzdata>=2025.2",
]
