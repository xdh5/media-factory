[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-factory"
version = "0.1.0"
description = "媒体内容自动生产与发布"
requires-python = ">=3.10"
dependencies = [
    "edge-tts>=7.2",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.1",
    "boto3>=1.34",
    "Pillow>=10.0",
    "mcp>=1.26,<2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "py-mini-racer>=0.6.0",
    # 系统依赖（非 pip 包）：ffmpeg 需自行安装并加入 PATH（如 winget install Gyan.FFmpeg）
]

[tool.setuptools]
packages = []
