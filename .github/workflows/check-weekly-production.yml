name: 周六早晨检查生产结果

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: check-weekly-production
  cancel-in-progress: false

jobs:
  check:
    name: 使用最新代码检查并补齐周生产
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 查找本次周任务
        uses: actions/github-script@v7
        with:
          script: |
            const now = Date.now();
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'weekly-production.yml',
              branch: 'main', event: 'schedule', per_page: 20
            });
            const run = data.workflow_runs.find(item => now - Date.parse(item.created_at) < 16 * 3600000);
            if (!run) {
              core.info('没有找到本次周生产任务');
              return;
            }
            if (run.status !== 'completed') {
              core.info(`原任务状态为 ${run.status}，补齐任务通过周生产并发组等待，不中断原任务`);
            }
            const scheduledDate = new Date(Date.parse(run.created_at) + 8 * 3600000);
            const daysUntilMonday = (8 - scheduledDate.getUTCDay()) % 7 || 7;
            scheduledDate.setUTCDate(scheduledDate.getUTCDate() + daysUntilMonday);
            const weekStart = scheduledDate.toISOString().slice(0, 10);
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'weekly-production.yml', ref: 'main',
              inputs: { week_start: weekStart }
            });
            await core.summary.addRaw(`已启动最新 main 补齐 ${weekStart} 当周缺失内容；原任务：${run.html_url}`).write();
