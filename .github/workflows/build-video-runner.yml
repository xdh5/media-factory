name: 构建视频生产环境

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ops/github_actions/Dockerfile
      - pyproject.toml
      - .github/workflows/build-video-runner.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: build-video-runner
  cancel-in-progress: true

jobs:
  build:
    name: 构建并发布预装依赖镜像
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Docker 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送生产环境
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/github_actions/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/media-factory-runner:latest
            ghcr.io/${{ github.repository_owner }}/media-factory-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Telegram 收尾通知
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出通知代码
        uses: actions/checkout@v5
      - name: 成功静默、失败有声通知
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python -m ops.github_actions publish_notify
          --notify-label "构建生产环境"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --skipped "false"
