name: 构建视频生产环境

on:
  workflow_call:
    outputs:
      image:
        description: 以摘要固定的视频生产镜像
        value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ops/github_actions/Dockerfile
      - ops/github_actions/runner-requirements.txt
      - .github/workflows/build-video-runner.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 获取固定摘要的视频生产镜像
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: video-runner-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.result.outputs.image }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Docker 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 查询当前提交的生产镜像
        id: existing
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repository="ghcr.io/${OWNER,,}/media-factory-runner"
          tag="$repository:locked-$GITHUB_SHA"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>inspect-error.log); then
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif ! grep -Eqi 'not found|manifest unknown' inspect-error.log; then
            cat inspect-error.log >&2
            exit 1
          fi

      - name: 首次构建并推送当前提交的生产镜像
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: ops/github_actions
          file: ops/github_actions/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.existing.outputs.tag }}
          cache-from: type=gha,scope=video-runner
          cache-to: type=gha,scope=video-runner,mode=max

      - name: 输出镜像摘要
        id: result
        env:
          REPOSITORY: ${{ steps.existing.outputs.repository }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
