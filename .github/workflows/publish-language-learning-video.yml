name: 发布语言学习视频

on:
  workflow_call:
    inputs:
      publish_date:
        description: 计划发布日期（YYYY-MM-DD）
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publish_date:
        description: 计划发布日期（YYYY-MM-DD）；留空默认北京时间今天
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: publish-language-learning-video
  cancel-in-progress: false

jobs:
  preflight:
    name: 第一步：查询计划发布日期的产物与平台记录
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      should_publish: ${{ steps.preflight.outputs.should_resume_publish }}
      run_id: ${{ steps.preflight.outputs.existing_run_id }}
      pending_targets: ${{ steps.preflight.outputs.pending_targets }}
      publish_date: ${{ steps.preflight.outputs.publish_date }}
      skip_reason: ${{ steps.preflight.outputs.skip_reason }}
    steps:
      - name: 检出发布代码
        uses: actions/checkout@v5

      - name: 查询可复用的 GitHub R2 成片和待发布平台
        id: preflight
        env:
          CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          INPUT_PUBLISH_DATE: ${{ inputs.publish_date }}
        run: python -m ops.github_actions language_learning_preflight --publish-date "$INPUT_PUBLISH_DATE"

      - name: 说明无需发布的原因
        if: ${{ steps.preflight.outputs.should_resume_publish != 'true' }}
        env:
          SKIP_REASON: ${{ steps.preflight.outputs.skip_reason }}
        run: echo "本次不执行语言学习发布：$SKIP_REASON" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: 第二步：预约尚未发布的平台
    needs: preflight
    if: ${{ needs.preflight.outputs.should_publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
      LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID }}
      LANGUAGE_LEARNING_YOUTUBE_CHANNEL_TITLE: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_CHANNEL_TITLE }}
      LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      zernio_api_key_meta: ${{ secrets.ZERNIO_API_KEY_META }}
      LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID }}
      LANGUAGE_LEARNING_TIKTOK_ACCOUNT_TITLE: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_ACCOUNT_TITLE }}
      LANGUAGE_LEARNING_TIKTOK_USERNAME: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_USERNAME }}
      LANGUAGE_LEARNING_INSTAGRAM_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_INSTAGRAM_ACCOUNT_ID }}
      LANGUAGE_LEARNING_FACEBOOK_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_FACEBOOK_ACCOUNT_ID }}
    steps:
      - name: 检出发布代码
        uses: actions/checkout@v5

      - name: 使用 R2 清单预约缺少的平台
        env:
          RUN_ID: ${{ needs.preflight.outputs.run_id }}
          TARGETS: ${{ needs.preflight.outputs.pending_targets }}
        shell: bash
        run: |
          MANIFEST_URL="${R2_PUBLIC_BASE_URL%/}/runs/language_learning/${RUN_ID}/r2-manifest.json"
          python -m ops.github_actions language_learning_publish --manifest-url "$MANIFEST_URL" --run-id "$RUN_ID" --targets "$TARGETS"

  notify:
    name: 第三步：Telegram 收尾通知
    needs: [preflight, publish]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出通知代码
        uses: actions/checkout@v5
      - name: 成功静默、失败有声通知
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python -m ops.github_actions workflow_notify
          --workflow-name "${{ github.workflow }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
