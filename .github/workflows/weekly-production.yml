name: 每周六生产下周内容

on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:
    inputs:
      week_start:
        description: 发布一周，填写该周周一日期（YYYY-MM-DD）
        required: false
        type: string
      publish_dates:
        description: 发布指定日期，填写一个或多个日期（YYYY-MM-DD），用英文逗号分隔。两项都留空时生产下周
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: weekly-production
  cancel-in-progress: false

env:
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/cache/pycache
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  runner-image:
    uses: ./.github/workflows/build-video-runner.yml

  plan:
    name: 计算下周计划发布日期
    needs: runner-image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.runner-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 5
    outputs:
      dates_json: ${{ steps.plan.outputs.dates_json }}
    steps:
      - name: 生成计划发布日期列表
        id: plan
        env:
          INPUT_WEEK_START: ${{ inputs.week_start }}
          INPUT_PUBLISH_DATES: ${{ inputs.publish_dates }}
        run: python -m github_actions weekly_plan --week-start "$INPUT_WEEK_START" --publish-dates "$INPUT_PUBLISH_DATES"

  produce-day:
    name: 生产财经及语言并预约发布 ${{ matrix.publish_date }}
    needs: [plan, runner-image]
    strategy:
      matrix:
        publish_date: ${{ fromJSON(needs.plan.outputs.dates_json) }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ${{ needs.runner-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      MEDIA_FACTORY_WORKSPACE: ${{ github.workspace }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PUBLISHING_CREDENTIALS_JSON: ${{ secrets.PUBLISHING_CREDENTIALS_JSON }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
    steps:
      - name: 检查生产所需配置
        id: configuration
        shell: bash
        run: |
          for name in \
            PUBLISHING_CREDENTIALS_JSON \
            CLOUDFLARE_DATA_API_URL CLOUDFLARE_DATA_API_TOKEN \
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL \
            PEXELS_API_KEY; do
            test -n "${!name}" || { echo "缺少 GitHub Secret：$name" >&2; exit 1; }
          done

      - name: 生产财经视频
        run: python -m github_actions finance_produce_day --publish-date "${{ matrix.publish_date }}"

      - name: 检查语言发布账号
        id: language-accounts
        if: ${{ !cancelled() && steps.configuration.outcome == 'success' }}
        run: python -m github_actions language_learning_account_check --publish-date "${{ matrix.publish_date }}"

      - name: 生产语言视频
        id: language-production
        if: ${{ !cancelled() && steps.language-accounts.outcome == 'success' }}
        run: python -m github_actions language_learning_produce_day --publish-date "${{ matrix.publish_date }}"

      - name: 预约发布学中文
        if: ${{ !cancelled() && steps.language-production.outcome == 'success' }}
        run: python -m github_actions language_learning_publish_day --publish-date "${{ matrix.publish_date }}"

      - name: 保存配音失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tts-diagnostics-${{ matrix.publish_date }}-${{ github.run_attempt }}
          path: cache/**/tts-diagnostics/**
          if-no-files-found: ignore
          retention-days: 7
