name: 每周六生产下周内容

on:
  schedule:
    - cron: "0 12 * * 6"
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      week_start:
        description: 可选；目标周起始周一 YYYY-MM-DD，留空检查并补齐下周缺失内容
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: weekly-production
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: 计算下周计划发布日期
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dates_json: ${{ steps.plan.outputs.dates_json }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 生成周一至周日日期列表
        id: plan
        env:
          INPUT_WEEK_START: ${{ inputs.week_start }}
        run: python -m ops.github_actions weekly_plan --week-start "$INPUT_WEEK_START"

  produce-day:
    name: 生产财经及语言 ${{ matrix.publish_date }}
    needs: plan
    strategy:
      matrix:
        publish_date: ${{ fromJSON(needs.plan.outputs.dates_json) }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      DASHSCOPE_API_KEY_FINANCE: ${{ secrets.DASHSCOPE_API_KEY_FINANCE }}
      DASHSCOPE_API_KEY_LANGUAGE: ${{ secrets.DASHSCOPE_API_KEY_LANGUAGE }}
      DASHSCOPE_MODEL: deepseek-v4-pro-0813
      DASHSCOPE_VISION_MODEL: qwen3.7-plus
      DASHSCOPE_ENABLE_THINKING: ${{ vars.DASHSCOPE_ENABLE_THINKING || 'false' }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      PUBLISHING_CREDENTIALS_JSON: ${{ secrets.PUBLISHING_CREDENTIALS_JSON }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      DASHSCOPE_IMAGE_MODEL: wan2.7-image-pro
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5

      - name: 检出采集与发布服务
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init integrations/media-collector integrations/media-publisher

      - name: 检查生产所需配置
        shell: bash
        run: |
          for name in \
            DASHSCOPE_API_KEY_FINANCE DASHSCOPE_API_KEY_LANGUAGE \
            CLOUDFLARE_DATA_API_URL CLOUDFLARE_DATA_API_TOKEN \
            PUBLISHING_CREDENTIALS_JSON \
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL \
            PEXELS_API_KEY; do
            test -n "${!name}" || { echo "缺少 GitHub Secret：$name" >&2; exit 1; }
          done

      - name: 按日期生产并直接上传财经 YouTube、交付语言 R2
        env:
          PUBLISH_DATE: ${{ matrix.publish_date }}
        run: >-
          python -m ops.github_actions weekly_day
          --publish-date "$PUBLISH_DATE"

  publish-chinese:
    name: 发布学中文视频 ${{ matrix.publish_date }}
    needs: [plan, produce-day]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      matrix:
        publish_date: ${{ fromJSON(needs.plan.outputs.dates_json) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/publish-language-learning-video.yml
    with:
      publish_date: ${{ matrix.publish_date }}
    secrets: inherit
