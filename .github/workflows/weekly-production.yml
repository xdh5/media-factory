name: 每周六生产下周内容

on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:
    inputs:
      week_start:
        description: 可选；目标周起始周一 YYYY-MM-DD，留空检查并补齐下周缺失内容
        required: false
        type: string
      publish_date:
        description: 可选；只补齐指定计划发布日期 YYYY-MM-DD
        required: false
        type: string
      publish_dates:
        description: 可选；只补齐这些计划发布日期，使用英文逗号分隔
        required: false
        type: string
      finance_only:
        description: 仅补齐财经成片，不生产语言内容或启动发布
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: weekly-production
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: 计算下周计划发布日期
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dates_json: ${{ steps.plan.outputs.dates_json }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: 生成周一至周日日期列表
        id: plan
        env:
          INPUT_WEEK_START: ${{ inputs.week_start }}
          INPUT_PUBLISH_DATE: ${{ inputs.publish_date }}
          INPUT_PUBLISH_DATES: ${{ inputs.publish_dates }}
        run: python -m ops.github_actions weekly_plan --week-start "$INPUT_WEEK_START" --publish-date "$INPUT_PUBLISH_DATE" --publish-dates "$INPUT_PUBLISH_DATES"

  produce-day:
    name: 生产财经及语言 ${{ matrix.publish_date }}
    needs: plan
    strategy:
      matrix:
        publish_date: ${{ fromJSON(needs.plan.outputs.dates_json) }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      DASHSCOPE_API_KEY_FINANCE: ${{ secrets.DASHSCOPE_API_KEY_FINANCE }}
      DASHSCOPE_API_KEY_LANGUAGE: ${{ secrets.DASHSCOPE_API_KEY_LANGUAGE }}
      DASHSCOPE_MODEL: qwen3.7-plus
      DASHSCOPE_VISION_MODEL: qwen3.7-plus
      DASHSCOPE_ENABLE_THINKING: ${{ vars.DASHSCOPE_ENABLE_THINKING || 'false' }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      DASHSCOPE_IMAGE_MODEL: wan2.7-image-pro
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: 检出采集与发布服务
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init integrations/media-collector integrations/media-publisher

      - name: 检查生产所需配置
        shell: bash
        run: |
          for name in \
            DASHSCOPE_API_KEY_FINANCE DASHSCOPE_API_KEY_LANGUAGE \
            CLOUDFLARE_DATA_API_URL CLOUDFLARE_DATA_API_TOKEN \
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL \
            PEXELS_API_KEY; do
            test -n "${!name}" || { echo "缺少 GitHub Secret：$name" >&2; exit 1; }
          done

      - name: 按日期生产并交付 R2
        env:
          PUBLISH_DATE: ${{ matrix.publish_date }}
          FINANCE_ONLY: ${{ inputs.finance_only && 'true' || 'false' }}
        run: >-
          python -m ops.github_actions weekly_day
          --publish-date "$PUBLISH_DATE"
          --finance-only "$FINANCE_ONLY"

      - name: 归还失败或取消任务占用的语言词包
        if: ${{ (failure() || cancelled()) && !inputs.finance_only }}
        env:
          PUBLISH_DATE: ${{ matrix.publish_date }}
        run: python -m ops.github_actions language_learning_release_pack --publish-date "$PUBLISH_DATE"

      - name: 保存配音失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tts-diagnostics-${{ matrix.publish_date }}-${{ github.run_attempt }}
          path: cache/**/tts-diagnostics/**
          if-no-files-found: ignore
          retention-days: 7

  publish-chinese:
    name: 发布学中文视频 ${{ matrix.publish_date }}
    needs: [plan, produce-day]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !inputs.finance_only }}
    strategy:
      matrix:
        publish_date: ${{ fromJSON(needs.plan.outputs.dates_json) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/publish-language-learning-video.yml
    with:
      publish_date: ${{ matrix.publish_date }}
    secrets: inherit
