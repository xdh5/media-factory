name: 每日生产次日内容

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      publish_date:
        description: 可选；计划发布日期 YYYY-MM-DD，留空使用北京时间明天
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: daily-production
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  plan:
    name: 计算次日计划发布日期
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish_date: ${{ steps.plan.outputs.publish_date }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 生成次日日期
        id: plan
        env:
          INPUT_PUBLISH_DATE: ${{ inputs.publish_date }}
        run: python -m ops.github_actions daily_plan --publish-date "$INPUT_PUBLISH_DATE"

  produce-day:
    name: 生产并发布 ${{ needs.plan.outputs.publish_date }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      DASHSCOPE_API_KEY_FINANCE: ${{ secrets.DASHSCOPE_API_KEY_FINANCE }}
      DASHSCOPE_API_KEY_LANGUAGE: ${{ secrets.DASHSCOPE_API_KEY_LANGUAGE }}
      DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL || 'qwen3.7-max' }}
      DASHSCOPE_VISION_MODEL: qwen3.7-max-2026-06-08
      DASHSCOPE_ENABLE_THINKING: ${{ vars.DASHSCOPE_ENABLE_THINKING || 'false' }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      DASHSCOPE_IMAGE_MODEL: ${{ vars.DASHSCOPE_IMAGE_MODEL }}
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
      LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID }}
      LANGUAGE_LEARNING_YOUTUBE_CHANNEL_TITLE: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_CHANNEL_TITLE }}
      LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      zernio_api_key_meta: ${{ secrets.ZERNIO_API_KEY_META }}
      LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID }}
      LANGUAGE_LEARNING_TIKTOK_ACCOUNT_TITLE: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_ACCOUNT_TITLE }}
      LANGUAGE_LEARNING_TIKTOK_USERNAME: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_USERNAME }}
      LANGUAGE_LEARNING_INSTAGRAM_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_INSTAGRAM_ACCOUNT_ID }}
      LANGUAGE_LEARNING_FACEBOOK_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_FACEBOOK_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5

      - name: 检查生产所需配置
        shell: bash
        run: |
          for name in \
            DASHSCOPE_API_KEY_FINANCE DASHSCOPE_API_KEY_LANGUAGE \
            CLOUDFLARE_DATA_API_URL CLOUDFLARE_DATA_API_TOKEN \
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL \
            TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            test -n "${!name}" || { echo "缺少 GitHub Secret：$name" >&2; exit 1; }
          done

      - name: 串行生产财经、语言并发布语言
        env:
          PUBLISH_DATE: ${{ needs.plan.outputs.publish_date }}
        run: python -m ops.github_actions daily_day --publish-date "$PUBLISH_DATE"
