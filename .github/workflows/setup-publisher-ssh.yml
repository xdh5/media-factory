name: 配置发布机 SSH 公钥

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    name: 授权当前电脑登录发布机
    runs-on: [self-hosted, Linux, X64, publisher]
    timeout-minutes: 10
    steps:
      - name: 写入 publisher 公钥
        env:
          SSH_PUBLIC_KEY: ${{ secrets.PUBLISHER_SSH_PUBLIC_KEY }}
        run: |
          test -n "$SSH_PUBLIC_KEY"
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          grep -qxF "$SSH_PUBLIC_KEY" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$SSH_PUBLIC_KEY" >> "$HOME/.ssh/authorized_keys"
          echo "SSH 公钥已授权给 $(whoami)@$(hostname)"
