name: 第四步：依次发布 R2 成片

on:
  workflow_call:
    inputs:
      manifest_url:
        description: 第三步输出的 R2 清单 URL
        required: true
        type: string
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 第三步输出的 R2 清单 URL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: media-factory-publisher
  cancel-in-progress: false

jobs:
  matrixmedia:
    name: 第四步 A：发布矩媒
    runs-on: [self-hosted, Linux, X64, publisher, matrixmedia]
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      MEDIA_FACTORY_PUBLISH_HOST: aliyun
      RUNNER_LABELS: publisher,matrixmedia
      MATRIXMEDIA_BIN: /usr/local/bin/matrixmedia
      PUBLISH_VENV: ${{ runner.tool_cache }}/media-factory-publisher
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      INPUT_MANIFEST_URL: ${{ inputs.manifest_url }}
    steps:
      - name: 检出发布代码
        uses: actions/checkout@v5

      - name: 检查独立 MatrixMedia
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
        run: |
          test -x "$MATRIXMEDIA_BIN"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          unset DBUS_SESSION_BUS_ADDRESS ELECTRON_RUN_AS_NODE
          xvfb-run -a env XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" LIBGL_ALWAYS_SOFTWARE=1 MATRIXMEDIA_DISABLE_TELEMETRY=1 "$MATRIXMEDIA_BIN" --no-sandbox --disable-gpu --disable-software-rasterizer --disable-dev-shm-usage cli accounts --json

      - name: 准备持久 Python 发布环境
        run: |
          if [ ! -x "$PUBLISH_VENV/bin/python" ]; then
            python3 -m venv "$PUBLISH_VENV"
          fi
          if ! "$PUBLISH_VENV/bin/python" -c "import requests, dotenv"; then
            "$PUBLISH_VENV/bin/python" -m pip install requests python-dotenv
          fi
          echo "$PUBLISH_VENV/bin" >> "$GITHUB_PATH"

      - name: 从 R2 下载并逐个平台发布矩媒
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg-runtime
        run: python -m automation.github_actions publish --manifest-url "$INPUT_MANIFEST_URL" --target matrixmedia

  youtube:
    name: 第四步 B：发布 YouTube
    needs: matrixmedia
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64, publisher]
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      INPUT_MANIFEST_URL: ${{ inputs.manifest_url }}
      PUBLISH_VENV: ${{ runner.tool_cache }}/media-factory-publisher
      LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID }}
      LANGUAGE_LEARNING_YOUTUBE_CHANNEL_TITLE: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_CHANNEL_TITLE }}
      LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
    steps:
      - name: 检出发布代码
        uses: actions/checkout@v5

      - name: 准备持久 Python 发布环境
        run: |
          if [ ! -x "$PUBLISH_VENV/bin/python" ]; then
            python3 -m venv "$PUBLISH_VENV"
          fi
          if ! "$PUBLISH_VENV/bin/python" -c "import googleapiclient, google.auth, requests, dotenv"; then
            "$PUBLISH_VENV/bin/python" -m pip install google-api-python-client google-auth requests python-dotenv
          fi
          echo "$PUBLISH_VENV/bin" >> "$GITHUB_PATH"

      - name: 从 R2 下载并逐条发布 YouTube
        run: python -m automation.github_actions publish --manifest-url "$INPUT_MANIFEST_URL" --target youtube

  tiktok:
    name: 第四步 C：发布 TikTok
    needs: youtube
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Linux, X64, publisher]
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      INPUT_MANIFEST_URL: ${{ inputs.manifest_url }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID }}
      LANGUAGE_LEARNING_TIKTOK_ACCOUNT_TITLE: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_ACCOUNT_TITLE }}
      LANGUAGE_LEARNING_TIKTOK_USERNAME: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_USERNAME }}
      PUBLISH_VENV: ${{ runner.tool_cache }}/media-factory-publisher
    steps:
      - name: 检出发布代码
        uses: actions/checkout@v5

      - name: 准备持久 Python 发布环境
        run: |
          if [ ! -x "$PUBLISH_VENV/bin/python" ]; then
            python3 -m venv "$PUBLISH_VENV"
          fi
          if ! "$PUBLISH_VENV/bin/python" -c "import requests, dotenv"; then
            "$PUBLISH_VENV/bin/python" -m pip install requests python-dotenv
          fi
          echo "$PUBLISH_VENV/bin" >> "$GITHUB_PATH"

      - name: 从 R2 逐条发布 TikTok
        run: python -m automation.github_actions publish --manifest-url "$INPUT_MANIFEST_URL" --target tiktok
