name: 生成财经视频

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 可选；仅作为数据库原稿改编后的话题侧重点
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: generate-finance-video
  cancel-in-progress: false

jobs:
  prepare:
    name: 第一步：准备生产环境
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5
      - name: 检查依赖与云端配置
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          python -c "import boto3, edge_tts, mcp, PIL; print('Python 项目依赖可用')"
          ffmpeg -version | head -n 1
          for name in DASHSCOPE_API_KEY CLOUDFLARE_DATA_API_URL CLOUDFLARE_DATA_API_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL; do
            test -n "${!name}" || { echo "缺少 GitHub Secret：$name" >&2; exit 1; }
          done

  generate:
    name: 第二步：制作财经视频并上传 R2
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONUTF8: "1"
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5
      - name: 恢复财经图库缓存
        uses: actions/cache@v4
        with:
          path: cache/assets/image_library_finance.tar
          key: image-library-finance-r2-v1
      - name: 生成财经成片并交付 R2
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
        run: python -m ops.github_actions finance --topic "$INPUT_TOPIC"

      - name: 确认未执行平台发布
        run: echo "本工作流到 R2 成片交付结束，不执行任何平台发布。"

      - name: 上传财经成片供下载
        uses: actions/upload-artifact@v4
        with:
          name: finance-video-${{ github.run_id }}
          path: |
            outputs/finance/**/*.mp4
            outputs/finance/**/*.txt
            cache/finance/**/cover.png
            cache/finance/**/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: 显示下载入口
        shell: bash
        run: |
          echo "## 下载本次财经产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[⬇️ 下载 finance-video-${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)" >> "$GITHUB_STEP_SUMMARY"
