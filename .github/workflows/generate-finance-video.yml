name: 生成财经视频

on:
  schedule:
    - cron: "0 20 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      publish_date:
        description: 计划发布日期（YYYY-MM-DD）；留空默认北京时间今天
        required: false
        type: string
      topic:
        description: 可选；仅作为数据库原稿改编后的话题侧重点
        required: false
        type: string

permissions:
  contents: read
  packages: read
  actions: write

concurrency:
  group: generate-finance-video
  cancel-in-progress: false

jobs:
  prepare:
    name: 第一步：准备生产环境
    outputs:
      should_generate: ${{ steps.preflight.outputs.should_generate }}
      publish_date: ${{ steps.preflight.outputs.publish_date }}
      skip_reason: ${{ steps.preflight.outputs.skip_reason }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5

      - name: 查询计划发布日期的财经成片与发布记录
        id: preflight
        env:
          CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          INPUT_PUBLISH_DATE: ${{ inputs.publish_date }}
          DEFAULT_DAYS_AHEAD: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python -m ops.github_actions finance_preflight --publish-date "$INPUT_PUBLISH_DATE" --default-days-ahead "$DEFAULT_DAYS_AHEAD"

      - name: 说明跳过原因
        if: ${{ steps.preflight.outputs.should_generate != 'true' }}
        env:
          SKIP_REASON: ${{ steps.preflight.outputs.skip_reason }}
        run: echo "该计划发布日期不重复生成财经视频：$SKIP_REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: 检查依赖与云端配置
        if: ${{ steps.preflight.outputs.should_generate == 'true' }}
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          python -c "import boto3, edge_tts, mcp, PIL; print('Python 项目依赖可用')"
          ffmpeg -version | head -n 1
          for name in DASHSCOPE_API_KEY CLOUDFLARE_DATA_API_URL CLOUDFLARE_DATA_API_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL; do
            test -n "${!name}" || { echo "缺少 GitHub Secret：$name" >&2; exit 1; }
          done

  generate:
    name: 第二步：制作财经视频并上传 R2
    needs: prepare
    if: ${{ needs.prepare.outputs.should_generate == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONUTF8: "1"
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_IMAGE_MODEL: ${{ vars.DASHSCOPE_IMAGE_MODEL }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5
      - name: 恢复存量图库工作流缓存
        id: cache-legacy-library
        uses: actions/cache/restore@v4
        with:
          path: data/image_library
          key: image-library-finance-legacy-v1
      - name: 缓存未命中时从 R2 恢复存量图库
        if: steps.cache-legacy-library.outputs.cache-hit != 'true'
        run: python -m ops.github_actions finance_restore_library --library-line finance
      - name: 保存存量图库到工作流缓存
        if: steps.cache-legacy-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/image_library
          key: image-library-finance-legacy-v1
      - name: 恢复千问图库工作流缓存
        id: cache-generated-library
        uses: actions/cache/restore@v4
        with:
          path: data/image_library_finance
          key: image-library-finance-generated-v2
      - name: 缓存未命中时从 R2 恢复千问图库
        if: steps.cache-generated-library.outputs.cache-hit != 'true'
        run: python -m ops.github_actions finance_restore_library --library-line finance_generated
      - name: 保存千问图库到工作流缓存
        if: steps.cache-generated-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/image_library_finance
          key: image-library-finance-generated-v2
      - name: 说明图库缓存来源
        shell: bash
        run: |
          if [ "${{ steps.cache-legacy-library.outputs.cache-hit }}" = "true" ]; then
            echo "存量图库 data/image_library 命中 GitHub Actions 缓存。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "存量图库 data/image_library 未命中缓存，已从 R2 恢复并写入缓存。" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.cache-generated-library.outputs.cache-hit }}" = "true" ]; then
            echo "千问图库 data/image_library_finance 命中 GitHub Actions 缓存。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "千问图库 data/image_library_finance 未命中缓存，已从 R2 恢复并写入缓存。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "每期生产会随机固定使用 finance 或 finance_generated 其中一个图库。" >> "$GITHUB_STEP_SUMMARY"
      - name: 生成财经成片并交付 R2
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          PUBLISH_DATE: ${{ needs.prepare.outputs.publish_date }}
        run: python -m ops.github_actions finance --topic "$INPUT_TOPIC" --publish-date "$PUBLISH_DATE"

      - name: 确认未执行平台发布
        run: echo "本工作流到 R2 成片交付结束，不执行任何平台发布。"

      - name: 上传财经成片供下载
        uses: actions/upload-artifact@v4
        with:
          name: finance-video-${{ github.run_id }}
          path: |
            output/finance/**/*.mp4
            output/finance/**/*.txt
            cache/finance/**/cover.png
            cache/finance/**/manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: 显示下载入口
        shell: bash
        run: |
          echo "## 下载本次财经产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[⬇️ 下载 finance-video-${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: 第三步：Telegram 收尾通知
    needs: [prepare, generate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出通知代码
        uses: actions/checkout@v5
      - name: 成功静默、失败有声通知
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python -m ops.github_actions workflow_notify
          --workflow-name "${{ github.workflow }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
