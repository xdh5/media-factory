name: 生成财经视频

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 可选；留空时由千问自动选择未重复话题
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: generate-finance-video
  cancel-in-progress: false

jobs:
  generate:
    name: 生成成片并上传 R2
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 恢复财经图库压缩包缓存
        uses: actions/cache@v4
        with:
          path: cache/assets/finance-images.tar
          key: finance-images-r2-v1

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装项目依赖
        run: python -m pip install .

      - name: 自动生成财经成片
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
        run: python -m automation.github_actions finance --topic "$INPUT_TOPIC"

