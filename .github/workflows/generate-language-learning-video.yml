name: 生成语言学习视频

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      topic:
        description: 可选；留空时自动选择未重复主题
        required: false
        type: string
      modes:
        description: 需要生成的语言方向
        required: true
        default: both
        type: choice
        options:
          - both
          - en-zh
          - en-ko
      source_run_id:
        description: 可选；填写旧 run ID 时复用原主题图、词表和裁剪框重新合成
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: generate-language-learning-video
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  STATE_PATH: cache/github_actions/language-learning-state.json
  HANDOFF_DIR: cache/github_actions/language-learning-handoff
  DIAGNOSTICS_DIR: cache/github_actions/language-learning-diagnostics

jobs:
  prepare:
    name: 第一步：准备生产环境
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5

      - name: 检查 Python、FFmpeg 与字体
        run: |
          python --version
          python -c "import boto3, edge_tts, mcp, PIL; print('Python 项目依赖可用')"
          ffmpeg -version | head -n 1
          fc-match "Noto Sans CJK SC"

      - name: 检查云端配置
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID }}
          LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          zernio_api_key_meta: ${{ secrets.ZERNIO_API_KEY_META }}
          LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          for name in DASHSCOPE_API_KEY CLOUDFLARE_DATA_API_URL CLOUDFLARE_DATA_API_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL YOUTUBE_OAUTH_CLIENT_ID YOUTUBE_OAUTH_CLIENT_SECRET LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN ZERNIO_API_KEY zernio_api_key_meta LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            test -n "${!name}" || { echo "缺少 GitHub Secret：$name" >&2; exit 1; }
          done
          echo "生产所需云端配置完整"

  generate:
    name: 第二步：制作语言学习视频
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      DASHSCOPE_IMAGE_MODEL: qwen-image-2.0-pro
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5

      - name: 初始化失败图记录
        shell: bash
        run: |
          mkdir -p "$DIAGNOSTICS_DIR"
          printf '{"status":"not_started"}\n' > "$DIAGNOSTICS_DIR/diagnostics.json"

      - name: 生成主题并校验双语词表
        if: ${{ !inputs.source_run_id }}
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_MODES: ${{ inputs.modes || 'both' }}
        shell: bash
        run: |
          case "$INPUT_MODES" in
            both) MODES="en-zh,en-ko" ;;
            en-zh) MODES="en-zh" ;;
            en-ko) MODES="en-ko" ;;
            *) echo "不支持的语言方向：$INPUT_MODES" >&2; exit 1 ;;
          esac
          python -m ops.github_actions language_learning_words --topic "$INPUT_TOPIC" --modes "$MODES" --state-path "$STATE_PATH"

      - name: 生成主题图并逐张检查十个抠图
        if: ${{ !inputs.source_run_id }}
        run: python -m ops.github_actions language_learning_cards --state-path "$STATE_PATH" --diagnostics-dir "$DIAGNOSTICS_DIR"

      - name: 复用旧主题图、词表和裁剪框重新拼卡
        if: ${{ inputs.source_run_id }}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python -m ops.github_actions language_learning_recompose_cards --source-run-id "$SOURCE_RUN_ID" --state-path "$STATE_PATH"

      - name: 合成配音与语言学习成片
        run: python -m ops.github_actions language_learning_videos --state-path "$STATE_PATH" --handoff-dir "$HANDOFF_DIR"

      - name: 保存成片交接文件
        uses: actions/upload-artifact@v4
        with:
          name: language-learning-${{ github.run_id }}
          path: cache/github_actions/language-learning-handoff
          if-no-files-found: error
          retention-days: 7

      - name: 保存失败主题图记录
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: language-learning-diagnostics-${{ github.run_id }}
          path: cache/github_actions/language-learning-diagnostics
          if-no-files-found: error
          retention-days: 1

  upload:
    name: 第三步：上传 R2
    needs: generate
    outputs:
      manifest_url: ${{ steps.upload.outputs.manifest_url }}
      run_id: ${{ steps.upload.outputs.run_id }}
      topic: ${{ steps.upload.outputs.topic }}
      subject_sheet_url: ${{ steps.upload.outputs.subject_sheet_url }}
      chinese_video_url: ${{ steps.upload.outputs.chinese_video_url }}
      korean_video_url: ${{ steps.upload.outputs.korean_video_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: 检出上传代码
        uses: actions/checkout@v5

      - name: 下载成片交接文件
        uses: actions/download-artifact@v4
        with:
          name: language-learning-${{ github.run_id }}
          path: cache/github_actions/language-learning-handoff

      - name: 上传成片、主题图与元数据
        id: upload
        run: python -m ops.github_actions language_learning_r2 --handoff-dir "$HANDOFF_DIR"

      - name: 确认 R2 交付完成
        run: echo "成片、主题图与发布清单已上传 R2。"

  publish:
    name: 第四步：排期四个平台
    needs: upload
    if: ${{ needs.upload.outputs.chinese_video_url != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
      LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_CHANNEL_ID }}
      LANGUAGE_LEARNING_YOUTUBE_CHANNEL_TITLE: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_CHANNEL_TITLE }}
      LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN: ${{ secrets.LANGUAGE_LEARNING_YOUTUBE_REFRESH_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      zernio_api_key_meta: ${{ secrets.ZERNIO_API_KEY_META }}
      LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_ACCOUNT_ID }}
      LANGUAGE_LEARNING_TIKTOK_ACCOUNT_TITLE: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_ACCOUNT_TITLE }}
      LANGUAGE_LEARNING_TIKTOK_USERNAME: ${{ secrets.LANGUAGE_LEARNING_TIKTOK_USERNAME }}
      LANGUAGE_LEARNING_INSTAGRAM_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_INSTAGRAM_ACCOUNT_ID }}
      LANGUAGE_LEARNING_FACEBOOK_ACCOUNT_ID: ${{ secrets.LANGUAGE_LEARNING_FACEBOOK_ACCOUNT_ID }}
    steps:
      - name: 检出发布代码
        uses: actions/checkout@v5

      - name: 给 YouTube、TikTok、Facebook、Instagram 排期
        env:
          MANIFEST_URL: ${{ needs.upload.outputs.manifest_url }}
          RUN_ID: ${{ needs.upload.outputs.run_id }}
        run: python -m ops.github_actions language_learning_publish --manifest-url "$MANIFEST_URL" --run-id "$RUN_ID"

  deliver:
    name: 第五步：提供产物下载
    needs: [upload, publish, upload_diagnostics]
    if: ${{ always() && needs.upload.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 显示下载入口
        env:
          TOPIC: ${{ needs.upload.outputs.topic }}
          SUBJECT_SHEET_URL: ${{ needs.upload.outputs.subject_sheet_url }}
          CHINESE_VIDEO_URL: ${{ needs.upload.outputs.chinese_video_url }}
          KOREAN_VIDEO_URL: ${{ needs.upload.outputs.korean_video_url }}
        shell: bash
        run: |
          echo "主题：$TOPIC" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SUBJECT_SHEET_URL" ]; then
            echo "<img src=\"$SUBJECT_SHEET_URL\" alt=\"原始主题图\" width=\"360\">" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$CHINESE_VIDEO_URL" ]; then
            echo "[下载中文学习视频]($CHINESE_VIDEO_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$KOREAN_VIDEO_URL" ]; then
            echo "[下载韩语学习视频]($KOREAN_VIDEO_URL)" >> "$GITHUB_STEP_SUMMARY"
          fi

  upload_diagnostics:
    name: 失败主题图：上传 R2
    needs: generate
    if: ${{ always() && (needs.generate.result == 'success' || needs.generate.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: 检出上传代码
        uses: actions/checkout@v5

      - name: 下载失败主题图记录
        uses: actions/download-artifact@v4
        with:
          name: language-learning-diagnostics-${{ github.run_id }}
          path: cache/github_actions/language-learning-diagnostics

      - name: 上传失败主题图
        run: python -m ops.github_actions language_learning_diagnostics_r2 --diagnostics-dir "$DIAGNOSTICS_DIR"

  notify:
    name: 第六步：Telegram 通知
    needs: [prepare, generate, upload, publish, deliver, upload_diagnostics]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WORKFLOW_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: 检出通知代码
        uses: actions/checkout@v5

      - name: 发送成功产物或失败阶段
        env:
          TOPIC: ${{ needs.upload.outputs.topic }}
          SUBJECT_SHEET_URL: ${{ needs.upload.outputs.subject_sheet_url }}
          CHINESE_VIDEO_URL: ${{ needs.upload.outputs.chinese_video_url }}
          KOREAN_VIDEO_URL: ${{ needs.upload.outputs.korean_video_url }}
        run: >-
          python -m ops.github_actions language_learning_notify
          --topic-value "$TOPIC"
          --subject-sheet-url "$SUBJECT_SHEET_URL"
          --chinese-video-url "$CHINESE_VIDEO_URL"
          --korean-video-url "$KOREAN_VIDEO_URL"
