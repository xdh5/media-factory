name: 生成语言学习视频

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 可选；留空时由千问自动选择未重复主题
        required: false
        type: string
      modes:
        description: 需要生成的语言方向
        required: true
        default: both
        type: choice
        options:
          - both
          - en-zh
          - en-ko

permissions:
  contents: read
  packages: read

concurrency:
  group: generate-language-learning-video
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  STATE_PATH: cache/github_actions/language-learning-state.json
  HANDOFF_DIR: cache/github_actions/language-learning-handoff
  DIAGNOSTICS_DIR: cache/github_actions/language-learning-diagnostics

jobs:
  prepare:
    name: 第一步：准备生产环境
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5

      - name: 检查 Python 与项目依赖
        run: |
          python --version
          python -c "import boto3, edge_tts, mcp, PIL; print('Python 项目依赖可用')"

      - name: 检查 FFmpeg 与中文字体
        run: |
          ffmpeg -version | head -n 1
          fc-match "Noto Sans CJK SC"

      - name: 检查云端配置
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
          CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          for name in DASHSCOPE_API_KEY CLOUDFLARE_DATA_API_URL CLOUDFLARE_DATA_API_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL; do
            test -n "${!name}" || { echo "缺少 GitHub Secret：$name" >&2; exit 1; }
          done
          echo "生产所需云端配置完整"

  generate:
    name: 第二步：制作语言学习视频
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      DASHSCOPE_IMAGE_MODEL: qwen-image-2.0-pro
    steps:
      - name: 检出生产代码
        uses: actions/checkout@v5

      - name: 初始化失败图交接目录
        shell: bash
        run: |
          mkdir -p "$DIAGNOSTICS_DIR"
          printf '{"status":"not_started"}\n' > "$DIAGNOSTICS_DIR/diagnostics.json"

      - name: 生成主题并校验双语词表
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_MODES: ${{ inputs.modes }}
        shell: bash
        run: |
          case "$INPUT_MODES" in
            both) MODES="en-zh,en-ko" ;;
            en-zh) MODES="en-zh" ;;
            en-ko) MODES="en-ko" ;;
            *) echo "不支持的语言方向：$INPUT_MODES" >&2; exit 1 ;;
          esac
          python -m automation.github_actions language_learning_words --topic "$INPUT_TOPIC" --modes "$MODES" --state-path "$STATE_PATH"

      - name: 生成主体图与双语卡片
        run: python -m automation.github_actions language_learning_cards --state-path "$STATE_PATH" --diagnostics-dir "$DIAGNOSTICS_DIR"

      - name: 保存失败主题图交接文件
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: language-learning-diagnostics-${{ github.run_id }}
          path: cache/github_actions/language-learning-diagnostics
          if-no-files-found: error
          retention-days: 1

      - name: 合成配音与中韩双模式成片
        run: python -m automation.github_actions language_learning_videos --state-path "$STATE_PATH" --handoff-dir "$HANDOFF_DIR"

      - name: 打包阶段产物
        uses: actions/upload-artifact@v4
        with:
          name: language-learning-${{ github.run_id }}
          path: cache/github_actions/language-learning-handoff
          if-no-files-found: error
          retention-days: 1

  upload:
    name: 第三步：上传 R2
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: 检出上传代码
        uses: actions/checkout@v5

      - name: 下载成片交接文件
        uses: actions/download-artifact@v4
        with:
          name: language-learning-${{ github.run_id }}
          path: cache/github_actions/language-learning-handoff

      - name: 上传成片与发布清单
        run: python -m automation.github_actions language_learning_r2 --handoff-dir "$HANDOFF_DIR"

      - name: 展示 R2 成片结果
        run: echo "成片、公网地址和发布清单已写入本次任务摘要。"

  upload_diagnostics:
    name: 失败主题图：上传 R2
    needs: generate
    if: ${{ always() && (needs.generate.result == 'success' || needs.generate.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
    steps:
      - name: 检出上传代码
        uses: actions/checkout@v5

      - name: 下载失败主题图交接文件
        uses: actions/download-artifact@v4
        with:
          name: language-learning-diagnostics-${{ github.run_id }}
          path: cache/github_actions/language-learning-diagnostics

      - name: 上传失败主题图
        run: python -m automation.github_actions language_learning_diagnostics_r2 --diagnostics-dir "$DIAGNOSTICS_DIR"
