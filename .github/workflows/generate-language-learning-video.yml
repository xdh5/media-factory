name: 生成语言学习视频

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 可选；留空时由千问自动选择未重复主题
        required: false
        type: string
      modes:
        description: 需要生成的语言方向
        required: true
        default: both
        type: choice
        options:
          - both
          - en-zh
          - en-ko

permissions:
  contents: read

concurrency:
  group: generate-language-learning-video
  cancel-in-progress: false

jobs:
  generate:
    name: 生成成片并上传 R2
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      VOLC_ARK_API_KEY: ${{ secrets.VOLC_ARK_API_KEY }}
      VOLC_ARK_IMAGE_MODEL: doubao-seedream-4-5-251128
      VOLC_ARK_IMAGE_URL: https://ark.cn-beijing.volces.com/api/v3/images/generations
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 恢复抠图模型缓存
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2netp-v1

      - name: 安装系统字体与 FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 安装项目依赖
        run: python -m pip install .

      - name: 自动生成语言学习成片
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_MODES: ${{ inputs.modes }}
        shell: bash
        run: |
          case "$INPUT_MODES" in
            both) MODES="en-zh,en-ko" ;;
            en-zh) MODES="en-zh" ;;
            en-ko) MODES="en-ko" ;;
            *) echo "不支持的语言方向：$INPUT_MODES" >&2; exit 1 ;;
          esac
          python -m automation.github_actions language_learning --topic "$INPUT_TOPIC" --modes "$MODES"

