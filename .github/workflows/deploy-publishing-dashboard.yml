name: 部署发布看板

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - ".github/workflows/deploy-publishing-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: publishing-dashboard-pages
  cancel-in-progress: true

env:
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/cache/pycache

jobs:
  deploy:
    name: 部署到 GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传静态看板
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/dashboard

      - name: 等待看板产物可查询
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$artifact_count" -eq 1 ]; then
              echo "看板产物已可查询，开始部署"
              exit 0
            fi
            echo "看板产物尚未出现在查询接口，第 $attempt 次检查"
            sleep 5
          done
          echo "看板产物上传完成后仍无法查询"
          exit 1

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
