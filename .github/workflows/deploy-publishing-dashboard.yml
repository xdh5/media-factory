name: 部署发布看板

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-publishing-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publishing-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到 GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传静态看板
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Telegram 收尾通知
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 检出通知代码
        uses: actions/checkout@v5
      - name: 成功静默、失败有声通知
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          python -m ops.github_actions workflow_notify
          --workflow-name "${{ github.workflow }}"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
