name: 部署发布看板

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-publishing-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publishing-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到 GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传静态看板
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
