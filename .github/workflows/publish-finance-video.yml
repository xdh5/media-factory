name: 发布财经 YouTube 视频

on:
  workflow_call:
    inputs:
      publish_date:
        description: 计划发布日期（YYYY-MM-DD）
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publish_date:
        description: 计划发布日期（YYYY-MM-DD）；留空默认北京时间今天
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: publish-finance-video
  cancel-in-progress: false

jobs:
  publish:
    name: 预约财经 YouTube 成片
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/xdh5/media-factory-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_DATA_API_URL: ${{ secrets.CLOUDFLARE_DATA_API_URL }}
      CLOUDFLARE_DATA_API_TOKEN: ${{ secrets.CLOUDFLARE_DATA_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      PUBLISHING_CREDENTIALS_JSON: ${{ secrets.PUBLISHING_CREDENTIALS_JSON }}
    steps:
      - name: 检出发布代码
        uses: actions/checkout@v5

      - name: 检出 media-publisher
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init integrations/media-publisher

      - name: 通过统一发布 MCP 预约缺失成片（最多尝试三次）
        env:
          INPUT_PUBLISH_DATE: ${{ inputs.publish_date }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python -m ops.github_actions finance_publish --publish-date "$INPUT_PUBLISH_DATE"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "第 ${attempt} 次预约失败，稍后重试"
              sleep $((30 * attempt))
            fi
          done
          echo "财经 YouTube 预约连续三次失败" >&2
          exit 1
