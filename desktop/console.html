<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Media Factory · 诊断与执行记录</title>
<style>body{font:15px system-ui;margin:24px auto;max-width:1120px;padding:0 20px;color:#e5e7eb;background:#111827}h1{font-size:26px}section{padding:20px;background:#1f2937;border:1px solid #374151;border-radius:12px;margin:18px 0}button{cursor:pointer;background:#2563eb;color:white;border:0;border-radius:6px;padding:9px 14px;margin:5px}input,textarea,select{box-sizing:border-box;width:100%;padding:9px;margin:6px 0;background:#111827;color:#eee;border:1px solid #4b5563;border-radius:6px}textarea{min-height:100px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111827;padding:14px;max-height:600px;overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #374151}small{color:#9ca3af}.error{color:#fca5a5}code{overflow-wrap:anywhere}</style></head>
<body><h1>Media Factory · 诊断与执行记录</h1><p>聊天使用原版 Open WebUI。本页负责配置、人工审批、故障知识及验收。</p><p id="home"></p><p id="notice" role="status"></p>
<section><h2>首次配置</h2><p>按 .env 格式填写模型与业务配置。保存后不会回显密钥；修改 MCP 业务配置后重启客户端。</p><textarea id="environment" spellcheck="false" placeholder="DASHSCOPE_BUSINESS_LINE=finance&#10;DASHSCOPE_API_KEY_FINANCE=你的密钥&#10;DASHSCOPE_API_KEY_LANGUAGE=你的密钥&#10;DASHSCOPE_MODEL=支持工具调用的模型&#10;AGENT_EMBEDDING_MODEL=text-embedding-v3"></textarea><button id="saveConfig">保存配置</button><small id="configured"></small></section>
<section><h2>任务与审批</h2><input id="task" placeholder="从下方真实执行记录选择任务，或填写任务 ID"><button id="loadTask">读取检查点</button><button id="pauseTask">请求暂停</button><pre id="taskState"></pre><div id="approval"></div><p>结果不确定时先核对业务回执，再提交真实 result；只有确认未执行，才明确授权重试。</p><textarea id="resumePayload" placeholder='{"result":{"task_path":"已核对的真实路径"}}'></textarea><button id="resumeTask">提交核对结果或恢复</button></section>
<section><h2>完整执行链路</h2><button id="refresh">刷新</button><table><thead><tr><th>状态</th><th>时间</th><th>任务</th><th>操作</th></tr></thead><tbody id="runs"></tbody></table><pre id="trace"></pre><input id="evidence" placeholder="人工验收依据，例如实际产物路径、验证步骤及结果"><button id="success">标注验收成功</button><button id="failure">标注验收失败</button></section>
<section><h2>故障知识与长期记忆</h2><button id="importProject">导入项目文档</button><input id="query" placeholder="输入实际故障信息"><button id="search">混合检索与重排</button><pre id="retrieval"></pre><select id="knowledgeKind"><option value="solution">已验证解决方案</option><option value="error">历史错误日志</option><option value="document">项目诊断文档</option></select><input id="source" placeholder="来源，例如故障工单或验证文档路径"><textarea id="content" placeholder="错误现象、诊断过程、经过验证的解决方案"></textarea><input id="solutionEvidence" placeholder="实际验证步骤与结果，不能用模型推测代替"><label><input id="verified" type="checkbox" style="width:auto">我已实际验证此解决方案</label><button id="remember">保存知识或长期记忆</button><pre id="documents"></pre></section>
<section><h2>真实评估</h2><p>任务成功率仅使用有依据的验收标签。RAG 测试集必须包含真实来源与代码核对标注；关键词命中不等于诊断正确。诊断准确率需要逐条复核本次生成答案，未复核时显示 null。</p><button id="agentEval">计算 Agent 指标</button><input id="cases" type="file" accept="application/json"><button id="ragEval">执行 RAG 标注集评估</button><pre id="evaluations"></pre><input id="evaluationId" placeholder="待复核评估 ID（执行后刷新可查看）"><input id="caseId" placeholder="样本 ID"><select id="correct"><option value="true">诊断正确</option><option value="false">诊断错误或包含未经证实的结论</option></select><input id="diagnosisEvidence" placeholder="逐条核对实际答案后的复核依据"><button id="reviewDiagnosis">保存诊断复核并计算准确率</button></section>
<script>
let selectedRun=null,currentTask=null;
async function api(url,body){const response=await fetch(url,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!response.ok)throw new Error(await response.text());return response.json();}
function show(id,value){document.getElementById(id).textContent=typeof value==='string'?value:JSON.stringify(value,null,2);}
function action(id,fn){document.getElementById(id).onclick=async()=>{try{show('notice','正在执行…');await fn();show('notice','操作完成');}catch(error){show('notice',error.message);}};}
async function refresh(){const data=await api('/api/overview');show('home','数据目录：'+data.home);show('configured','已配置：'+data.configuration.join('、'));show('documents',data.documents);show('evaluations',data.evaluations);const table=document.getElementById('runs');table.replaceChildren();for(const run of data.runs){const row=document.createElement('tr');for(const value of [run.status,new Date(run.started*1000).toLocaleString(),run.task_id]){const cell=document.createElement('td');cell.textContent=value;row.append(cell);}const cell=document.createElement('td');const button=document.createElement('button');button.textContent='查看链路及任务';button.onclick=async()=>{selectedRun=run.id;document.getElementById('task').value=run.task_id;show('trace',await api('/api/traces/'+run.id));await loadTask();};cell.append(button);row.append(cell);table.append(row);}}
async function loadTask(){const task=document.getElementById('task').value;currentTask=await api('/api/tasks/'+encodeURIComponent(task));show('taskState',currentTask);const area=document.getElementById('approval');area.replaceChildren();for(const item of currentTask.interrupts||[]){if(item.kind==='approval'){for(const [text,approved] of [['批准这次操作',true],['拒绝这次操作',false]]){const button=document.createElement('button');button.textContent=text;button.onclick=async()=>{await api('/api/tasks/'+encodeURIComponent(task)+'/resume',{interrupt_id:item.id,response:{approved}});show('notice','已提交，请刷新检查点');};area.append(button);}}}}
action('saveConfig',async()=>{show('notice',await api('/api/config',{environment:document.getElementById('environment').value}));document.getElementById('environment').value='';await refresh();});
action('refresh',refresh);action('loadTask',loadTask);action('pauseTask',()=>api('/api/tasks/'+encodeURIComponent(document.getElementById('task').value)+'/pause',{}));
action('resumeTask',async()=>{const pending=currentTask?.interrupts?.[0];await api('/api/tasks/'+encodeURIComponent(document.getElementById('task').value)+'/resume',{interrupt_id:pending?.id,response:pending?JSON.parse(document.getElementById('resumePayload').value||'{}'):undefined});});
action('success',()=>api('/api/runs/'+selectedRun+'/label',{success:true,evidence:document.getElementById('evidence').value}));action('failure',()=>api('/api/runs/'+selectedRun+'/label',{success:false,evidence:document.getElementById('evidence').value}));
action('importProject',async()=>{await api('/api/knowledge/import-project',{});await refresh();});action('search',async()=>show('retrieval',await api('/api/knowledge/search',{query:document.getElementById('query').value})));
const reindexButton=document.createElement('button');reindexButton.textContent='更换 Embedding 模型后重建向量';reindexButton.onclick=async()=>{try{show('notice',await api('/api/knowledge/reindex',{}));}catch(error){show('notice',error.message);}};document.getElementById('importProject').after(reindexButton);
action('remember',async()=>{await api('/api/knowledge/ingest',{kind:document.getElementById('knowledgeKind').value,source:document.getElementById('source').value,content:document.getElementById('content').value,evidence:document.getElementById('solutionEvidence').value,verified:document.getElementById('verified').checked});await refresh();});
action('agentEval',async()=>show('evaluations',await api('/api/evals/agent',{})));action('ragEval',async()=>{const file=document.getElementById('cases').files[0];if(!file)throw new Error('请选择真实标注集 JSON');const data=JSON.parse(await file.text());show('evaluations',await api('/api/evals/rag',{cases:data.cases||data,k:5}));});action('reviewDiagnosis',async()=>show('evaluations',await api('/api/evals/'+encodeURIComponent(document.getElementById('evaluationId').value)+'/diagnosis-label',{case_id:document.getElementById('caseId').value,correct:document.getElementById('correct').value==='true',evidence:document.getElementById('diagnosisEvidence').value})));refresh().catch(error=>show('notice',error.message));
</script></body></html>
