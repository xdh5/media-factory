  <text x="490" y="102" text-anchor="middle" class="section">MCP WORKFLOW LAYER</text>

  <rect x="300" y="125" width="380" height="105" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
