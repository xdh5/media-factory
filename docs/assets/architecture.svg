<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Media Factory system architecture</title>
  <desc id="desc">An AI agent orchestrates two production lines and supporting workflows through shared media tools, data services, storage, automation, and publishing platforms.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 28px Inter, Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 17px Inter, Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .node { font: 600 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

