  <text x="815" y="632" text-anchor="middle" class="node">Topic deduplication  ·  asynchronous tasks  ·  idempotent records  ·  resumable runs</text>
  <text x="815" y="663" text-anchor="middle" class="small">Both production lines reuse the same tools, storage, delivery, and reliability controls.</text>
