<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="查看财经视频可用、占用和已使用的预制来源文章。">
    <title>财经文章｜媒体发布日历</title>
    <link rel="stylesheet" href="./styles.css?v=20261016-1">
  </head>
  <body data-page="finance-articles">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="shell">
      <header class="topbar">
        <div>
          <h1>财经文章</h1>
        </div>
      </header>

      <nav class="page-nav" aria-label="内容看板">
        <a class="page-nav-link" href="./index.html">发布日历</a>
        <a class="page-nav-link" href="./language-packs.html">语言词包</a>
        <a class="page-nav-link is-active" href="./finance-articles.html" aria-current="page">财经文章</a>
        <a class="page-nav-link" href="./anime.html">动画</a>
      </nav>

      <p id="inventoryNote" class="inventory-note" aria-live="polite"></p>

      <section class="toolbar inventory-toolbar" aria-label="文章筛选">
        <label>
          <span>关键词</span>
          <input id="searchInput" type="search" placeholder="搜索标题、正文或关键词">
        </label>
        <label>
          <span>使用状态</span>
          <select id="statusFilter">
            <option value="ready" selected>未使用</option>
            <option value="pending_editorial">待编辑</option>
            <option value="">全部状态</option>
            <option value="reserved">已占用</option>
            <option value="used">已使用</option>
          </select>
        </label>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="inventoryResults" class="inventory-results" aria-label="财经文章列表"></section>
    </main>

    <script src="./inventory.js?v=20261017-1" defer></script>
  </body>
</html>
