<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="按计划发布日期查看媒体工厂的本地产物和平台发布状态。">
    <title>媒体发布日历</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MEDIA FACTORY</p>
          <h1>媒体发布日历</h1>
          <p class="subtitle">按计划发布日期核对产物，以及每条内容已经到达的平台。</p>
        </div>
      </header>

      <section id="toolbar" class="toolbar" aria-label="查询条件">
        <label>
          <span>计划发布日期</span>
          <input id="dateInput" type="date">
        </label>
        <div class="toolbar-actions">
          <button id="queryButton" class="primary-button" type="button">查询这一天</button>
          <button id="allButton" class="secondary-button" type="button">查看全部</button>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="results" class="results" aria-label="产物与发布记录"></section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
